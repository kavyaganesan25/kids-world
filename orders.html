<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids World | Orders</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Orders Page CSS -->
    <link rel="stylesheet" href="orders.css">
</head>

<body>

    <!-- Header -->

    <header>

        <nav>

            <div class="logo">Kids World</div>

            <ul class="menu">

                <li><a href="index.html">🏠 Home</a></li>

                <li><a href="shop.html">🛍 Shop</a></li>

                <li><a href="orders.html">📦 Orders</a></li>

                <li><a href="contact.html">📞 Contact</a></li>

            </ul>

        </nav>

    </header>

    <!-- Order Section -->

    <section class="orders-page">

        <div class="order-card">

            <h1>📦 Track Your Toy</h1>

            <p class="subtitle">
                Help your toy reach home by collecting all the stars!
            </p>

            <!-- Journey -->

            <div class="road">

                <div class="line"></div>

                <div id="truck">🚚</div>

                <div class="gift">🎁</div>

            </div>

            <!-- Stars -->

            <div class="stars">

                <span class="star" data-step="1">⭐</span>

                <span class="star" data-step="2">⭐</span>

                <span class="star" data-step="3">⭐</span>

                <span class="star" data-step="4">⭐</span>

                <span class="star" data-step="5">⭐</span>

            </div>

            <!-- Progress -->

            <div class="progress-box">

                <div class="step active" id="step1">
                    📦 Order Placed
                </div>

                <div class="step" id="step2">
                    🧸 Packed
                </div>

                <div class="step" id="step3">
                    🚚 Shipped
                </div>

                <div class="step" id="step4">
                    📍 Out For Delivery
                </div>

                <div class="step" id="step5">
                    🎉 Delivered
                </div>

            </div>

            <!-- Status -->

            <div id="status">

                Click the ⭐ stars to move your truck!

            </div>

            <!-- Reward -->

            <div id="reward">

                🎉 Surprise Gift Unlocked! 🧸🎁

            </div>

        </div>

    </section>

    <script src="orders.js"></script>

</body>

</html>
